services:
  - type: web
    name: kaamgar-backend
    runtime: python
    plan: free
    rootDir: Skill-Hire
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn access_control:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: KAAMGAR_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: POSTGRES_MIGRATION_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
