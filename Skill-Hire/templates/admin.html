<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HireNow Admin</title>
<style>
:root{--navy:#062746;--navy2:#031c35;--orange:#ffa31a;--bg:#f4f7fb;--card:#fff;--text:#10233f;--muted:#71839a;--line:#e3eaf2;--green:#20b978;--red:#d9534f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}header strong span{color:var(--orange)}main{max-width:1180px;margin:auto;padding:22px}.login,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.login{max-width:460px;margin:70px auto}.login h1{margin-top:0}.row{display:flex;gap:10px}.login input{flex:1;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--orange);color:#18283b}.danger{background:#fff0ef;color:#b63b36}.approve{background:#e8f8f1;color:#147b51}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}nav{display:flex;gap:8px;margin:18px 0}.tab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:800}.tab.active{background:var(--navy);color:#fff}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.toolbar input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1f5;font-size:12px}th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#fafbfd}.pill{display:inline-block;padding:5px 8px;border-radius:9px;background:#edf4fb;font-size:10px;font-weight:800}.pending{background:#fff3d9;color:#9a6a00}.verified,.paid,.completed{background:#e7f8ef;color:#15784f}.rejected,.cancelled{background:#fff0ef;color:#b33d37}.empty{padding:35px;text-align:center;color:var(--muted)}#app{display:none}.msg{font-size:12px;color:var(--red);margin-top:8px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}main{padding:14px}header{padding:15px}}
</style></head><body>
<header><strong>Hire<span>Now</span> Admin</strong><span>Operations & Verification</span></header>
<main><section class="login" id="login"><h1>Admin Access</h1><p>Sign in with your HireNow admin account.</p><div class="row"><input type="text" id="username" autocomplete="username" placeholder="Admin username"><input type="password" id="password" autocomplete="current-password" placeholder="Password"><button class="btn primary" id="loginBtn">Login</button></div><div class="msg" id="loginMsg"></div></section>
<section id="app"><div class="toolbar"><div><b>Admin Dashboard</b><span id="adminIdentity" style="margin-left:8px;color:var(--muted);font-size:11px"></span></div><button class="btn danger" id="logoutBtn">Logout</button></div><div class="stats"><div class="stat"><b id="sWorkers">0</b><span>Workers</span></div><div class="stat"><b id="sHirers">0</b><span>Hirers</span></div><div class="stat"><b id="sPending">0</b><span>Pending KYC</span></div><div class="stat"><b id="sActive">0</b><span>Active bookings</span></div><div class="stat"><b id="sCompleted">0</b><span>Completed</span></div><div class="stat"><b id="sValue">₹0</b><span>Paid booking value</span></div></div>
<nav><button class="tab active" data-tab="verification">Verification</button><button class="tab" data-tab="workers">Workers</button><button class="tab" data-tab="bookings">Bookings</button></nav>
<section class="panel active" id="panel-verification"><div class="toolbar"><h2>Pending verification</h2><button class="btn" onclick="loadAll()">Refresh</button></div><div id="pending"></div></section>
<section class="panel" id="panel-workers"><div class="toolbar"><h2>Workers</h2><input id="workerSearch" placeholder="Search worker"></div><div id="workers"></div></section>
<section class="panel" id="panel-bookings"><div class="toolbar"><h2>Bookings</h2><input id="bookingSearch" placeholder="Search booking"></div><div id="bookings"></div></section>
</section></main>
<script>
var csrfToken="",workerRows=[],bookingRows=[];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function api(path,opts){opts=opts||{};opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});if(csrfToken&&opts.method&&opts.method!=="GET")opts.headers["X-CSRF-Token"]=csrfToken;return fetch(path,opts).then(function(r){return r.json().then(function(d){if(r.status===401&&path.indexOf("/auth/login")<0){document.getElementById("app").style.display="none";document.getElementById("login").style.display="block";}return {ok:r.ok,data:d};});});}
function pill(v){return '<span class="pill '+esc(v)+'">'+esc(v||"—")+'</span>';}
function table(head,rows){return '<div class="table-wrap"><table><thead><tr>'+head.map(function(x){return "<th>"+x+"</th>";}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';}
function loadAll(){return Promise.all([api("/api/admin/overview"),api("/api/admin/workers/pending"),api("/api/admin/workers"),api("/api/admin/bookings")]).then(function(r){if(!r[0].ok)throw Error(r[0].data.error||"Admin access failed");var s=r[0].data;document.getElementById("sWorkers").textContent=s.workers;document.getElementById("sHirers").textContent=s.hirers;document.getElementById("sPending").textContent=s.pending_verifications;document.getElementById("sActive").textContent=s.active_bookings;document.getElementById("sCompleted").textContent=s.completed_bookings;document.getElementById("sValue").textContent="₹"+Number(s.paid_value).toLocaleString("en-IN");renderPending(r[1].data||[]);workerRows=r[2].data||[];bookingRows=r[3].data||[];renderWorkers();renderBookings();});}
function renderPending(rows){var el=document.getElementById("pending");if(!rows.length){el.innerHTML='<div class="card empty">No pending verification requests.</div>';return;}el.innerHTML=table(["Worker","Skill","City","Document","Action"],rows.map(function(w){return "<tr><td><b>"+esc(w.name)+"</b><br>"+esc(w.phone)+"</td><td>"+esc(w.skill)+"</td><td>"+esc(w.city)+"</td><td>"+(w.id_document_path?'<button class="btn" onclick="viewDoc('+w.id+')">View ID</button>':"No document")+'</td><td><button class="btn approve" onclick="verify('+w.id+',true)">Approve</button> <button class="btn danger" onclick="verify('+w.id+',false)">Reject</button></td></tr>'; }));}
function viewDoc(id){fetch("/api/admin/workers/"+id+"/document",{credentials:"same-origin"}).then(function(r){if(!r.ok)return r.json().then(function(d){throw Error(d.error||"Document unavailable");});return r.blob();}).then(function(b){window.open(URL.createObjectURL(b),"_blank");}).catch(function(e){alert(e.message);});}
function verify(id,approve){if(!confirm(approve?"Approve this worker ID?":"Reject this worker ID?"))return;api("/api/admin/workers/"+id+"/verify",{method:"POST",body:JSON.stringify({approve:approve})}).then(function(r){if(!r.ok)throw Error(r.data.error);loadAll();}).catch(function(e){alert(e.message);});}
function renderWorkers(){var q=document.getElementById("workerSearch").value.toLowerCase();var rows=workerRows.filter(function(w){return JSON.stringify(w).toLowerCase().indexOf(q)>=0;});document.getElementById("workers").innerHTML=table(["ID","Worker","Skill","City","Status","Jobs","Online"],rows.map(function(w){return "<tr><td>#"+w.id+"</td><td><b>"+esc(w.name)+"</b><br>"+esc(w.phone)+"</td><td>"+esc(w.skill)+"</td><td>"+esc(w.city)+"</td><td>"+pill(w.verification_status)+"</td><td>"+esc(w.jobs_completed)+"</td><td>"+(w.is_online?"Online":"Offline")+"</td></tr>";}));}
function renderBookings(){var q=document.getElementById("bookingSearch").value.toLowerCase();var rows=bookingRows.filter(function(b){return JSON.stringify(b).toLowerCase().indexOf(q)>=0;});document.getElementById("bookings").innerHTML=table(["Booking","Hirer","Worker","Schedule","Amount","Status","Payment"],rows.map(function(b){return "<tr><td>#"+b.id+"</td><td>"+esc(b.hirer_name)+"</td><td><b>"+esc(b.worker_name)+"</b><br>"+esc(b.worker_skill)+"</td><td>"+esc(b.start_date)+" "+esc(b.start_time||"")+"</td><td>₹"+Number(b.total_amount).toLocaleString("en-IN")+"</td><td>"+pill(b.status)+"</td><td>"+pill(b.payment_status)+"<br>"+esc(b.payment_method)+"</td></tr>";}));}
function showAdmin(user){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("adminIdentity").textContent=user||"";loadAll();}
document.getElementById("loginBtn").onclick=function(){var username=document.getElementById("username").value.trim(),password=document.getElementById("password").value;document.getElementById("loginMsg").textContent="";api("/api/admin/auth/login",{method:"POST",body:JSON.stringify({username:username,password:password})}).then(function(r){if(!r.ok)throw Error(r.data.error||"Login failed");csrfToken=r.data.csrf_token;document.getElementById("password").value="";showAdmin(r.data.username);}).catch(function(e){document.getElementById("loginMsg").textContent=e.message;});};
document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("loginBtn").click();});
document.getElementById("logoutBtn").onclick=function(){api("/api/admin/auth/logout",{method:"POST",body:"{}"}).then(function(){csrfToken="";document.getElementById("app").style.display="none";document.getElementById("login").style.display="block";});};
api("/api/admin/auth/me").then(function(r){if(r.ok){csrfToken=r.data.csrf_token;showAdmin(r.data.username);}});
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});document.querySelectorAll(".panel").forEach(function(x){x.classList.remove("active");});b.classList.add("active");document.getElementById("panel-"+b.dataset.tab).classList.add("active");};});
document.getElementById("workerSearch").oninput=renderWorkers;document.getElementById("bookingSearch").oninput=renderBookings;
</script></body></html>
